# TITIAN — rotasi log BIRD via newsyslog (FreeBSD).
# Pasang di /usr/local/etc/newsyslog.conf.d/titian-bird.conf.
# Default: harian (@T00), simpan 3 arsip terkompresi gzip (Z) + file aktif.
# Ubah sesuai keinginan: "@T00" -> "@W0T00" untuk mingguan,
# angka "3" -> jumlah arsip yang disimpan.
# Flag R: sesudah rotasi, jalankan titian-bird-reopen (birdc configure)
# supaya BIRD membuka ulang file log yang baru.
/var/log/bird/bird.log 644 3 * @T00 ZR /usr/local/sbin/titian-bird-reopen
