# TITIAN bird.d/bgp.conf — BGP contoh lab (dual-stack channel).
# Neighbor TEST-NET 192.0.2.1 tidak akan pernah tersambung; protokol
# tetap tampil di `birdc show protocols` (state Connect/Active).
# import/export none: tidak ada route yang bocor ke/dari peer contoh.
protocol bgp bgp_lab {
    # ASN global dari header bird.conf (define TITIAN_ASN).
    local as TITIAN_ASN;
    neighbor 192.0.2.1 as 64513;
    ipv4 { import none; export none; };
    ipv6 { import none; export none; };
}
