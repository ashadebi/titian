# TITIAN bird.d/protocol.conf — device + kernel.
# Lab: import/export none (BIRD tidak menyentuh tabel kernel);
# produksi: sesuaikan import/export di sini lalu `generate protocol`.
protocol device {
    scan time 10;
}

protocol kernel {
    ipv4 { import none; export none; };
}
protocol kernel {
    ipv6 { import none; export none; };
}
