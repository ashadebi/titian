# TITIAN bird.d/ospf.conf — OSPF contoh lab (area 0, interface lo*).
# Loopback tidak membentuk adjacency; protokol tetap tampil di
# `birdc show protocols`. import/export none: aman untuk lab.
protocol ospf ospf_lab {
    area 0 {
        interface "lo*" {
        };
    };
    ipv4 { import none; export none; };
    ipv6 { import none; export none; };
}
