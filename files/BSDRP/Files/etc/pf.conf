# pf.conf — BSDRP base ruleset (shipped in the image).
# Managed by klish: subsystem anchors are loaded by their apply scripts.
# Do NOT put policy rules here — policy lives in the anchors.
#
# Anchors:
#   nat            — NAT/rdr rules (firewall subsystem, /etc/pf-nat.conf)
#   firewall       — filter rules (firewall subsystem, /etc/pf-firewall.conf)
#   traffic-shape  — dummynet divert rules (traffic-shape subsystem,
#                     /etc/pf-traffic-shape.conf)
#
# Evaluation order: translation (nat/rdr) runs before filtering, so the
# firewall anchor sees post-NAT addresses. Inside the firewall anchor,
# rules are `quick` (first match wins); traffic that passes the firewall
# then reaches the traffic-shape anchor for dummynet shaping.

set skip on lo
scrub in all

nat-anchor "nat"
rdr-anchor "nat"
anchor "firewall"
anchor "traffic-shape"
