#
#	syslog.conf — BSDRP/Titian (FreeBSD default, dimodifikasi 2026-11-13)
#
#	Spaces ARE valid field separators in this file. However,
#	other *nix-like systems still insist on using tabs as field
#	separators. If you are sharing this file between systems, you
#	may want to use only tabs as field separators here.
#	Consult the syslog.conf(5) manpage.
#
#	PERUBAHAN 2026-11-13 (Titian): baris /dev/console DIHAPUS.
#	Alasan: log *.err / kern.warning / auth.notice (termasuk log konfd
#	habis restart + pesan kernel bridge0) dilempar ke console/monitor
#	dan mengganggu terminal user. Log tetap masuk ke file
#	(/var/log/messages, /var/log/daemon.log, dst.) — tidak ada log
#	yang hilang, hanya tidak tampil di console lagi.
#	Baris asli (dinonaktifkan):
#	*.err;kern.warning;auth.notice;mail.crit		/dev/console
*.notice;authpriv.none;kern.debug;lpr.info;mail.crit;news.err	/var/log/messages
security.*					/var/log/security
auth.info;authpriv.info				/var/log/auth.log
mail.info					/var/log/maillog
cron.*						/var/log/cron
!-devd
*.=debug					/var/log/debug.log
*.emerg						*
daemon.info					/var/log/daemon.log
# uncomment this to log all writes to /dev/console to /var/log/console.log
# touch /var/log/console.log and chmod it to mode 600 before it will work
#console.info					/var/log/console.log
# uncomment this to enable logging of all log messages to /var/log/all.log
# touch /var/log/all.log and chmod it to mode 600 before it will work
#*.*						/var/log/all.log
# uncomment this to enable logging to a remote loghost named loghost
#*.*						@loghost
# uncomment these if you're running inn
#news.crit					/var/log/news/news.crit
#news.err					/var/log/news/news.err
#news.notice					/var/log/news/news.notice
# uncomment this if you wish to see messages produced by devd
#devd.info					/var/log/devd.log
