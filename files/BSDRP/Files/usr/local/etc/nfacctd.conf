! BSDRP_klish — default nfacctd.conf (pmacct NetFlow/IPFIX collector)
!
! Listen: 127.0.0.1:9996 — samakan dengan ngnetflow_dst di vendor.conf.
! Output: CSV ke /var/log/nfacctd.log, di-flush tiap 60 detik.
! Bila router ini jadi kolektor untuk router lain, ubah nfacctd_ip ke 0.0.0.0
! (dan batasi pengirim via firewall / nfacctd_allow_file).
!
daemonize: true
pidfile: /var/run/nfacctd.pid

! NetFlow/IPFIX listener
nfacctd_ip: 127.0.0.1
nfacctd_port: 9996
nfacctd_time_new: true

! Satu plugin print bernama [flows]
plugins: print[flows]
aggregate[flows]: src_host, dst_host, src_port, dst_port, proto
print_output[flows]: csv
print_output_file[flows]: /var/log/nfacctd.log
print_output_file_append[flows]: true
print_refresh_time[flows]: 60
